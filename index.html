<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miss You Bhai</title>
<style>
  body { margin:0; background:#000; font-family: sans-serif; overflow:hidden; }
  .page { width:100vw; height:100vh; position:absolute; top:0; left:0; display:flex; flex-direction:column; justify-content:center; align-items:center; opacity:0; transition: all 1.5s ease; transform: scale(0.9); background-size:cover; background-position:center; }
  .page.active { opacity:1; transform: scale(1); z-index:10; }
  .overlay { position:absolute; width:100%; height:100%; background: rgba(0,0,0,0.6); }
  .content { position:relative; z-index:2; text-align:center; color:white; padding:20px; }
  .content h1 { font-size: 3rem; margin-bottom:10px; text-shadow: 2px 2px 10px black; }
  .content p { font-size: 1.5rem; opacity:0.9; }
  .content img { width:250px; height:250px; border-radius:20px; object-fit:cover; border:4px solid white; box-shadow: 0 0 30px rgba(255,255,255,0.3); margin-bottom:20px; }
  @keyframes sad { 0%{transform:translateY(0)} 50%{transform:translateY(-10px)} 100%{transform:translateY(0)} }
  .content img { animation: sad 3s infinite; }
</style>
</head>
<body>

<!-- PAGE 1 -->
<div class="page active" style="background-image: url('pic1.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <img src="pic1.jpg">
    <h1>Miss You Bhai 😢</h1>
    <p>Teri kami har pal mehsoos hoti hai</p>
  </div>
</div>

<!-- PAGE 2 -->
<div class="page" style="background-image: url('pic2.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <img src="pic2.jpg">
    <h1>Yaadein Reh Gayi</h1>
    <p>Woh hasna, woh baatein sab yaad hai</p>
  </div>
</div>

<!-- PAGE 3 -->
<div class="page" style="background-image: url('pic3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <img src="pic3.jpg">
    <h1>Laut Aao Bhai</h1>
    <p>Bohat tanha ho gaya hun tere bina</p>
  </div>
</div>

<!-- PAGE 4 -->
<div class="page" style="background-image: url('pic4.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <img src="pic4.jpg">
    <h1>Tum Jahan Bhi Ho</h1>
    <p>Khush rehna, tumhara bhai tumhe miss karta hai</p>
  </div>
</div>

<!-- PAGE 5 - ENDING -->
<div class="page" style="background-image: url('pic5.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <img src="pic5.jpg">
    <h1>Always Miss You 💔</h1>
    <p>My Brother, My Strength</p>
  </div>
</div>

<audio id="music" autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
  let pages = document.querySelectorAll('.page');
  let current = 0;
  function showNext() {
    pages[current].classList.remove('active');
    current = (current + 1) % pages.length;
    pages[current].classList.add('active');
  }
  setInterval(showNext, 4000); // har 4 second baad page change
  // music play on click
  document.body.addEventListener('click', () => {
    document.getElementById('music').play();
  });
</script>
</body>
</html>
